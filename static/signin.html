<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in · Sahayak Shield</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <main class="shell">
    <header class="hero">
      <p class="brand">Sahayak Shield</p>
      <h1>Sign in</h1>
      <p class="intro">Optional. You can use all safety checks without an account.</p>
    </header>

    <section class="card auth">
      <p id="authStatus" class="hint">Use your email address and password.</p>
      <label for="email">Email address</label>
      <input id="email" type="email" autocomplete="email" placeholder="you@example.com">
      <label for="password">Password</label>
      <input id="password" type="password" autocomplete="current-password" minlength="10" placeholder="At least 10 characters">
      <div class="formActions">
        <button id="login" type="button">Sign in</button>
        <button id="signup" class="secondary" type="button">Create account</button>
      </div>
      <a class="backLink" href="/">Back to home</a>
    </section>
  </main>
  <script src="/static/signin.js"></script>
</body>
</html>
