services:
  - type: web
    name: sahayak-shield
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: DEMO_MODE
        value: "true"
      - key: MAX_UPLOAD_MB
        value: "5"
      - key: RATE_LIMIT_PER_MINUTE
        value: "10"
